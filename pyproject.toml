[project]
name = "pac-man"
version = "0.1.0"
description = "Pac-Man in Python with generated mazes, built as a 42 curriculum project."
readme = "README.md"
licence = "LICENSE"
requires-python = ">=3.10"
authors = [
    { name = "Daniel Filipe Moreira Fernandes", email = "danmorei@student.codam.nl" },
    { name = "Martin Sanz Sanchez", email = "masanz-s@student.codam.nl"}
]

dependencies = [
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "flake8-pyproject>=1.2.4",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
]

[tool.mypy]
strict = true
mypy_path = "."
exclude = [
    ".venv/"
]

[tool.flake8]
exclude = [
    ".venv/"
]

[tool.pytest.ini_options]
testpath = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
