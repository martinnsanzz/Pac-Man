name: CI
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Lint
        run: |
          if [ -n "$(git ls-files '*.py')" ]; then
            uv run flake8 .
            uv run mypy . --strict
          else
            echo "No Python files, skipping"
          fi